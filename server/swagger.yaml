openapi: 3.0.0
info:
  title: RescueBite — Food Rescue & Surplus Redistribution API
  version: 1.0.0
  description: >
    Production REST API documentation for RescueBite connecting food donors,
    recipient organizations, volunteers, and administrators to safely eliminate edible waste.
servers:
  - url: http://localhost:5000
    description: Local Development Server

paths:
  /api/health:
    get:
      summary: Health check endpoint
      tags: [System]
      responses:
        200:
          description: API server is healthy and connected

  /api/auth/register:
    post:
      summary: Register a new donor, recipient, or volunteer account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, phone]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [donor, recipient, volunteer]
                organizationName:
                  type: string
      responses:
        201:
          description: Registration successful, returns user object and sets HttpOnly JWT cookie
        400:
          description: Validation error
        409:
          description: Email already registered

  /api/auth/login:
    post:
      summary: Authenticate user credentials and issue secure session cookie
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
        401:
          description: Invalid email or password

  /api/auth/logout:
    post:
      summary: Clear authentication session cookie
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: Logout successful

  /api/auth/me:
    get:
      summary: Get authenticated user profile and organization details
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: User profile retrieved

  /api/listings:
    get:
      summary: Discover surplus food listings with spatial filtering, dietary tags, and pagination
      tags: [Listings]
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: storageRequirements
          schema:
            type: string
        - in: query
          name: dietary
          schema:
            type: string
        - in: query
          name: lng
          schema:
            type: number
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: maxDistance
          schema:
            type: number
            description: Proximity radius in meters
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 12
      responses:
        200:
          description: Surplus food listings retrieved
    post:
      summary: Publish a new surplus food donation (Donor Only)
      tags: [Listings]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category, quantity, unit, pickupWindow, storageRequirements, location]
      responses:
        201:
          description: Listing published successfully

  /api/listings/{id}:
    get:
      summary: Retrieve surplus food listing details
      tags: [Listings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Listing details retrieved
        404:
          description: Listing not found
    put:
      summary: Update listing details (Donor Owner Only)
      tags: [Listings]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Listing updated
        403:
          description: Forbidden
    delete:
      summary: Cancel surplus food listing (Donor Owner or Admin)
      tags: [Listings]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Listing withdrawn

  /api/listings/{id}/recipient-matches:
    get:
      summary: Rank eligible verified recipient organizations using configurable weighted scoring (Donor or Admin)
      tags: [Listings]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: maxRadiusMeters
          schema:
            type: number
            default: 15000
      responses:
        200:
          description: Ranked matches with normalized scores and match explanations

  /api/reservations:
    post:
      summary: Request atomic reservation of surplus food portions (Verified Recipient Only)
      tags: [Reservations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, quantityReserved]
              properties:
                listingId:
                  type: string
                quantityReserved:
                  type: integer
                  minimum: 1
                recipientNotes:
                  type: string
                idempotencyKey:
                  type: string
      responses:
        201:
          description: Reservation created atomically without overbooking risk
        200:
          description: Idempotent replay of existing reservation
        409:
          description: Insufficient surplus inventory or concurrent reservation conflict

  /api/reservations/my:
    get:
      summary: Retrieve recipient claims and active pickup verification codes
      tags: [Reservations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: Reservations retrieved

  /api/reservations/donor/inbound:
    get:
      summary: Retrieve inbound reservation claims on donor listings (Donor Only)
      tags: [Reservations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: Inbound claims retrieved

  /api/reservations/{id}/approve:
    patch:
      summary: Confirm reservation and issue pickup handoff code (Donor Only)
      tags: [Reservations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Reservation confirmed

  /api/reservations/{id}/reject:
    patch:
      summary: Decline reservation and atomically release inventory exactly once (Donor Only)
      tags: [Reservations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Reservation rejected and inventory restored

  /api/reservations/{id}/cancel:
    patch:
      summary: Cancel reservation and atomically release inventory exactly once (Recipient or Donor)
      tags: [Reservations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Reservation cancelled and inventory restored

  /api/tasks/board:
    get:
      summary: Retrieve available unassigned courier pickup missions for volunteers
      tags: [Volunteer Tasks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: List of available delivery tasks
        403:
          description: Restricted to volunteers and administrators

  /api/tasks/my:
    get:
      summary: Retrieve tasks claimed by current volunteer
      tags: [Volunteer Tasks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: Volunteer claimed tasks

  /api/tasks/{id}:
    get:
      summary: Retrieve specific pickup task details
      tags: [Volunteer Tasks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Task details retrieved

  /api/tasks/{id}/claim:
    post:
      summary: Atomically claim an unassigned pickup task with concurrency protection
      tags: [Volunteer Tasks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Task claimed successfully
        409:
          description: Task already claimed by another volunteer

  /api/tasks/{id}/status:
    patch:
      summary: Advance task lifecycle stage with cryptographic code verification
      tags: [Volunteer Tasks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStatus]
              properties:
                newStatus:
                  type: string
                  enum: [en_route_pickup, picked_up, en_route_delivery, delivered, cancelled]
                candidateCode:
                  type: string
                  description: Short-lived plain verification code (RB-XXXX) provided by donor at pickup or recipient at delivery
                actualRescuedKg:
                  type: number
                  description: Verified scale measurement in kg upon completed handover
                temperatureCelsius:
                  type: number
                notes:
                  type: string
      responses:
        200:
          description: State transition succeeded
        400:
          description: Invalid state transition, expired code, or code reuse
        401:
          description: Invalid confirmation code
        403:
          description: Unauthorized actor

  /api/tasks/{id}/temp-log:
    post:
      summary: Record transit cold-chain temperature checkpoint
      tags: [Volunteer Tasks]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temperatureCelsius]
              properties:
                temperatureCelsius:
                  type: number
                notes:
                  type: string
      responses:
        200:
          description: Temperature log saved

  /api/reports:
    post:
      summary: File an incident or safety moderation report
      tags: [Reports]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason, description]
              properties:
                targetType:
                  type: string
                  enum: [listing, user, organization, reservation]
                targetId:
                  type: string
                targetTitle:
                  type: string
                reason:
                  type: string
                  enum: [food_safety_hazard, spoilage, undeclared_allergen, no_show, fraud, inappropriate_behavior, other]
                description:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high, critical]
      responses:
        201:
          description: Safety report filed and queued for administrative review

  /api/reports/my:
    get:
      summary: Retrieve incident reports filed by authenticated user
      tags: [Reports]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: User filed reports list

  /api/admin/overview:
    get:
      summary: Platform management summary telemetry
      tags: [Administration]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: System overview statistics
        403:
          description: Admin access only

  /api/admin/reports:
    get:
      summary: Retrieve moderation reports queue
      tags: [Administration]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: Moderation queue retrieved

  /api/admin/reports/{id}:
    patch:
      summary: Resolve or dismiss moderation report
      tags: [Administration]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [under_review, resolved, dismissed]
                adminNotes:
                  type: string
      responses:
        200:
          description: Report resolved and action audited

  /api/admin/users/{id}/status:
    patch:
      summary: Update account status (e.g. suspend user account)
      tags: [Administration]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended, deactivated]
                reason:
                  type: string
      responses:
        200:
          description: Account status updated and audited

  /api/admin/audit-logs:
    get:
      summary: Retrieve immutable system audit trail
      tags: [Administration]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: Audit logs list

  /api/analytics:
    get:
      summary: Platform-wide sustainability, rescued weight, and operational metrics
      tags: [Analytics]
      responses:
        200:
          description: Operational telemetry with distinct verified vs estimated measurements

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rescuebite_jwt
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

